[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qp"
version = "0.1.0"
description = "A full systematic-trading research pipeline: data -> features -> signals -> backtest -> risk -> paper execution, with an MCP layer to come."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Batbandi Gerelkhuu" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
ml = ["torch>=2.2"]            # LSTM / GRU sequence models
data = ["yfinance>=0.2.40"]   # real market data adapter
opt = ["cvxpy>=1.4"]          # convex portfolio optimisation
mcp = ["mcp>=1.2"]            # Model Context Protocol server
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
qp = "qp.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
